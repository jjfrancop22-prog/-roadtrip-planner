<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="RoadTrip Planner: dashboard inteligente para organizar y continuar viajes.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RoadTrip">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
  <link rel="icon" href="./assets/icons/icon-192.png">
  <link rel="stylesheet" href="./css/app.css">
  <title>RoadTrip Planner</title>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">ROADTRIP PLANNER</p>
        <h1 id="screen-title">Dashboard</h1>
      </div>
      <button id="install-button" class="icon-button hidden" type="button" aria-label="Instalar aplicación">⬇️</button>
    </header>

    <main id="app" class="app-main" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button type="button" class="nav-item active" data-route="dashboard">
        <span>📊</span><small>Dashboard</small>
      </button>
      <button type="button" class="nav-item" data-route="trip">
        <span>🌎</span><small>Viaje</small>
      </button>
      <button type="button" class="nav-item" data-route="settings">
        <span>⚙️</span><small>Ajustes</small>
      </button>
    </nav>
  </div>

  <dialog id="budget-dialog" class="modal">
    <form method="dialog" id="budget-form" class="modal-card">
      <div class="modal-header">
        <h2>Actualizar presupuesto</h2>
        <button type="button" class="icon-button" data-close-dialog="budget-dialog">✕</button>
      </div>
      <label>Presupuesto total (USD)
        <input id="budget-total" type="number" min="0" step="0.01" required>
      </label>
      <label>Gastado hasta ahora (USD)
        <input id="budget-spent" type="number" min="0" step="0.01" required>
      </label>
      <div class="modal-actions">
        <button type="button" class="button ghost" data-close-dialog="budget-dialog">Cancelar</button>
        <button type="submit" class="button primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <dialog id="weather-dialog" class="modal">
    <form method="dialog" id="weather-form" class="modal-card">
      <div class="modal-header">
        <h2>Actualizar clima</h2>
        <button type="button" class="icon-button" data-close-dialog="weather-dialog">✕</button>
      </div>
      <label>Ciudad
        <input id="weather-city" required>
      </label>
      <div class="form-grid">
        <label>Temperatura
          <input id="weather-temp" type="number" required>
        </label>
        <label>Unidad
          <select id="weather-unit">
            <option value="°F">°F</option>
            <option value="°C">°C</option>
          </select>
        </label>
      </div>
      <label>Condición
        <input id="weather-condition" placeholder="Ej. Soleado">
      </label>
      <div class="modal-actions">
        <button type="button" class="button ghost" data-close-dialog="weather-dialog">Cancelar</button>
        <button type="submit" class="button primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
