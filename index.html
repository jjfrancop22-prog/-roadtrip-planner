<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RoadTrip AI">
<meta name="description" content="RoadTrip AI con experiencia visual inspirada en Apple Maps.">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="./css/app.css">
<title>RoadTrip AI</title>
</head>
<body>
<div id="map" aria-label="Mapa del viaje"></div>

<header class="floating-topbar">
  <div class="brand-block">
    <span class="eyebrow">ROADTRIP AI</span>
    <strong id="trip-title">USA 2026</strong>
  </div>
  <div class="top-actions">
    <button id="location-button" class="round-button" type="button" aria-label="Estoy aquí">◎</button>
    <button id="timeline-button" class="round-button" type="button" aria-label="Abrir cronología">☰</button>
  </div>
</header>

<div id="progress-pill" class="progress-pill">Preparando viaje…</div>

<section id="bottom-sheet" class="bottom-sheet compact" aria-label="Información de la próxima parada">
  <button id="sheet-handle" class="sheet-handle" type="button" aria-label="Expandir o contraer información">
    <span></span>
  </button>
  <div id="sheet-content"></div>
</section>

<button id="continue-button" class="continue-button" type="button">🚗 Continuar viaje</button>

<dialog id="timeline-dialog">
  <div class="dialog-card">
    <header class="dialog-header">
      <div>
        <span class="eyebrow">LÍNEA DE TIEMPO</span>
        <h2 id="timeline-title">USA 2026</h2>
      </div>
      <button class="round-button" data-close="timeline-dialog" type="button">✕</button>
    </header>
    <div id="timeline-content"></div>
  </div>
</dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
