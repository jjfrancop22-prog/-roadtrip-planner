<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RoadTrip AI">
<meta name="description" content="Plataforma personal y modular de planificación de viajes.">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
<link rel="stylesheet" href="./css/app.css">
<title>RoadTrip AI</title>
</head>
<body>
<header class="topbar">
  <div>
    <small>ROADTRIP AI</small>
    <h1 id="page-title">Dashboard</h1>
  </div>
  <button id="install-button" class="icon-button hidden">⬇️</button>
</header>

<main id="app"></main>

<nav class="bottom-nav">
  <button data-route="dashboard" class="active"><span>✨</span><small>Inicio</small></button>
  <button data-route="trips"><span>🌎</span><small>Viajes</small></button>
  <button data-route="planner"><span>🧠</span><small>Planificador</small></button>
  <button data-route="center"><span>🧳</span><small>Centro</small></button>
  <button data-route="settings"><span>⚙️</span><small>Ajustes</small></button>
</nav>

<dialog id="trip-dialog">
  <form id="trip-form" method="dialog">
    <div class="dialog-head"><h2>Nuevo viaje</h2><button type="button" data-close="trip-dialog">✕</button></div>
    <label>Nombre<input id="trip-name" required placeholder="Ej. Canadá 2027"></label>
    <label>Ruta<input id="trip-route" placeholder="Toronto → Ottawa → Montreal"></label>
    <div class="cols">
      <label>Fecha inicio<input id="trip-start" type="date"></label>
      <label>Fecha fin<input id="trip-end" type="date"></label>
    </div>
    <div class="cols">
      <label>Viajeros<input id="trip-travelers" type="number" min="1" value="1"></label>
      <label>Emoji<input id="trip-emoji" value="🚗"></label>
    </div>
    <label>Vehículo o transporte<input id="trip-vehicle" placeholder="Carro, tren, avión..."></label>
    <label>Presupuesto<input id="trip-budget" type="number" min="0" step="0.01" value="0"></label>
    <div class="dialog-actions"><button type="button" data-close="trip-dialog">Cancelar</button><button class="primary">Guardar</button></div>
  </form>
</dialog>

<script type="module" src="./js/app.js"></script>
</body>
</html>
