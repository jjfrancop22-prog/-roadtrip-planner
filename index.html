<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RoadTrip">
<meta name="description" content="Asistente visual de rutas, clima, ubicación e itinerarios.">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="./css/app.css">
<title>RoadTrip Planner</title>
</head>
<body>
<div id="map" aria-label="Mapa del viaje"></div>

<header class="floating-header">
  <div>
    <small>ROADTRIP</small>
    <strong id="trip-name">USA 2026</strong>
  </div>
  <div class="header-actions">
    <button id="location-button" class="circle-button" aria-label="Estoy aquí">◎</button>
    <button id="timeline-button" class="circle-button" aria-label="Ver itinerario">☰</button>
  </div>
</header>

<section id="status-pill" class="status-pill">Preparando ruta…</section>

<section id="sheet" class="bottom-sheet">
  <div class="grabber"></div>
  <div id="sheet-content"></div>
</section>

<button id="continue-button" class="continue-button" type="button">🚗 Continuar viaje</button>

<dialog id="timeline-dialog">
  <div class="dialog-card">
    <div class="dialog-head">
      <div><small>CRONOLOGÍA</small><h2>USA 2026</h2></div>
      <button data-close="timeline-dialog" class="circle-button">✕</button>
    </div>
    <div id="timeline-content"></div>
  </div>
</dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
